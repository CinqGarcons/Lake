syntax = "proto3";
package tensorio;

message TIOStep {
  int64 ne_0 = 1;
  int64 ne_1 = 2;
  int64 ne_2 = 3;
  int64 ne_3 = 4;
  uint64 nb_0 = 5;
  uint64 nb_1 = 6;
  uint64 nb_2 = 7;
  uint64 nb_3 = 8;
  uint32 dtype = 9;
  string request_id = 10;
  double temperature = 11;
  bytes data = 12;
}

message Ack {}

service TIOService {
  rpc Send(stream TIOStep) returns (Ack);
}
